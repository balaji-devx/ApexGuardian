name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend Tests & Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ApexGuardian/backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ApexGuardian/backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python Code
        run: python -m compileall -q .

      - name: Run Test Suite
        env:
          ACTIVE_REGION: coimbatore
          ENVIRONMENT: test
        run: python -m pytest -q

  frontend-ci:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ApexGuardian/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ApexGuardian/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.placeholder.invalid/api/v1
          NEXT_PUBLIC_ACTIVE_REGION: coimbatore
        run: npm run build

  deploy:
    name: Production Deployment Gate
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Render Backend Deployment
      # ---------------------------------------------------------
      - name: Trigger Render Deploy Hook
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render deployment hook..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${RENDER_DEPLOY_HOOK}")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Render deployment triggered successfully (HTTP $HTTP_STATUS)."
          else
            echo "::error::Render deploy hook failed with status $HTTP_STATUS."
            exit 1
          fi

      - name: Inform Render Deployment Status
        if: ${{ env.RENDER_DEPLOY_HOOK == '' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Notice: RENDER_DEPLOY_HOOK secret is not configured in repository settings. Render automated deployment skipped."

      # ---------------------------------------------------------
      # Vercel Frontend Deployment
      # ---------------------------------------------------------
      - name: Deploy Frontend to Vercel
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://apexguardian-backend.onrender.com/api/v1' }}
          NEXT_PUBLIC_ACTIVE_REGION: coimbatore
        run: |
          echo "Deploying ApexGuardian/frontend to Vercel..."
          npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN --cwd=ApexGuardian/frontend
          npx vercel build --prod --token=$VERCEL_TOKEN --cwd=ApexGuardian/frontend
          npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN --cwd=ApexGuardian/frontend

      - name: Inform Vercel Deployment Status
        if: ${{ env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Notice: VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID secrets are not fully configured. Vercel automated deployment skipped."
